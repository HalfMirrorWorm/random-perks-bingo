plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        name = 'Modmuss'
        url = 'https://maven.modmuss50.me/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Yet Another Bingo API
    maven {
        name = 'Yet Another Bingo'
        url = 'https://gitlab.com/api/v4/projects/48318565/packages/maven'
        content { includeGroup 'me.jfenn.bingo' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 26.x 不混淆, Loom 不再提供 modImplementation / modCompileOnly.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"

    // ---- Yet Another Bingo ----
    // 编译期依赖主 jar: 提供 mixin 目标类 (ScoreUpdateService 等) 与内部类型
    // Modrinth 上的文件名是 bingo-<version>.jar, 不是 slug 名.
    // 注意: 绝不能 include / shadow 进本 mod 的 jar (会导致 mod id 重复崩溃)
    compileOnly("maven.modrinth:yet-another-minecraft-bingo:${project.bingo_version}") {
        artifact { name = 'bingo' }
    }
    // 开发环境运行时加载真正的 bingo
    localRuntime("maven.modrinth:yet-another-minecraft-bingo:${project.bingo_version}") {
        artifact { name = 'bingo' }
    }
    // 公开 API (BingoEvents 等)
    compileOnly "me.jfenn.bingo:api:${project.bingo_api_version}"

    // bingo 的 Jar-in-Jar 依赖在开发环境不会被 Loom 自动加载, 手动补齐 (仅开发环境, 不会打进本 mod)
    localRuntime "com.zaxxer:HikariCP:7.0.2"
    localRuntime "org.xerial:sqlite-jdbc:3.50.3.0"
    localRuntime "app.cash.sqldelight:runtime-jvm:2.0.2"
    localRuntime "app.cash.sqldelight:jdbc-driver:2.0.2"
    // Kotlin stdlib 由 fabric-language-kotlin 在运行时提供 (与 bingo 的惯例一致)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
    // kotlinx-serialization: 版本必须与 fabric-language-kotlin 内置版本一致 (同 bingo)
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"

    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "random-perks-bingo" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            // 固定开发客户端离线用户名: 不指定时 fabric-loader 每次启动都随机生成
            // "Player###", 服务器上每次都是新玩家 (要重新 OP, 词条/进度也留不住)
            programArgs('--username', 'Player839')
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    jvmToolchain(25)
}

// bingo 2.15 把 BingoState / BingoTeam 标成了 internal. 词条回顾要读这些状态,
// 编译期把 bingo jar 当成 friend, 不改调用方式.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    def bingoJars = configurations.compileClasspath.files.findAll { it.name.startsWith('bingo-') && it.name.endsWith('.jar') }
    if (!bingoJars.isEmpty()) {
        compilerOptions {
            freeCompilerArgs.add('-Xfriend-paths=' + bingoJars.collect { it.absolutePath }.join(File.pathSeparator))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
}
