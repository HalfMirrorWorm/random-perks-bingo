# 随机词条 Bingo 扩展 (Random Perks Bingo)
# 目标: MC 26.1/26.1.1/26.1.2 + Yet Another Bingo 2.15.x
# 2.15.1+mc26.1 的 Modrinth 文件 404, 编译对着还能下到的 2.15.0.

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version=0.1.5
maven_group=com.randomperks
archives_base_name=random-perks-bingo

# Fabric / Minecraft. 26.x 发行版已是官方名, Loom 不再单独拉 Mojmap.
minecraft_version=26.1.2
loader_version=0.19.5
fabric_version=0.155.3+26.1.2

# Kotlin (必须与 fabric-language-kotlin 的 kotlin 版本一致)
kotlin_version=2.3.21
fabric_language_kotlin_version=1.13.11+kotlin.2.3.21

# 依赖的 bingo 版本. 见文件头: 编译对着 2.15.0.
bingo_version=2.15.0+mc26.1
bingo_api_version=2.15.0
