# 随机词条 Bingo 扩展 (Random Perks Bingo)
# 目标: MC 1.21.11 + Yet Another Bingo 2.9.7

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version=0.1.5
maven_group=com.randomperks
archives_base_name=random-perks-bingo

# Fabric / Minecraft (与 bingo 2.9.7 的 mc1.21.11 模块对齐)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.20.1
fabric_version=0.141.6+1.21.11

# Kotlin (必须与 fabric-language-kotlin 的 kotlin 版本一致)
kotlin_version=2.2.21
fabric_language_kotlin_version=1.13.7+kotlin.2.2.21

# 依赖的 bingo 版本
bingo_version=2.9.7+mc1.21.11
bingo_api_version=2.9.7
