# 随机词条 Bingo 扩展 (Random Perks Bingo)
# 目标: MC 1.21.6/1.21.7/1.21.8 + Yet Another Bingo 2.9.6

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version=0.0.9
maven_group=com.randomperks
archives_base_name=random-perks-bingo

# Fabric / Minecraft (与 bingo 2.9.6 的 mc1.21.7 模块对齐)
minecraft_version=1.21.7
yarn_mappings=1.21.7+build.2
loader_version=0.18.4
fabric_version=0.128.2+1.21.7

# Kotlin (必须与 fabric-language-kotlin 的 kotlin 版本一致)
kotlin_version=2.2.21
fabric_language_kotlin_version=1.13.7+kotlin.2.2.21

# 依赖的 bingo 版本
bingo_version=2.9.6+mc1.21.7
bingo_api_version=2.9.6
